# Example settings — placeholders only. Never put real API keys or real vault paths.
general:
  timezone: Asia/Shanghai
  output_language: zh-CN
  transcript_languages:
    - zh
    - en

execution:
  worker_concurrency: 1
  max_video_duration_minutes: 180

thresholds:
  summary_score: 7.0

weekly:
  top_n: 10

retry:
  max_attempts: 3
  base_delay_seconds: 2
  max_delay_seconds: 60
  jitter_ratio: 0.2

timeouts:
  http_seconds: 30
  local_model_seconds: 300
  cloud_model_seconds: 120

transcription:
  model: mlx-community/whisper-large-v3-turbo
  model_revision: a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb
  model_weights_bytes: 1613977612
  model_weights_sha256: 951ed3fc1203e6a62467abb2144a96ce7eafca8fa77e3704fdb8635ff3e7f8a6
  parameter_policy_version: mlx-whisper-v1
  task: transcribe
  language_hint: null
  temperature: 0.0
  compression_ratio_threshold: 2.4
  logprob_threshold: -1.0
  no_speech_threshold: 0.6
  condition_on_previous_text: true
  word_timestamps: false
  initial_prompt: null
  fp16: true
  min_free_disk_gib: 8
  min_available_memory_gib: 6
  max_audio_bytes: 2000000000

local_scoring:
  model: qwen3:8b
  base_url: http://127.0.0.1:11434
  expected_model_digest: sha256:500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
  temperature: 0.0
  max_output_tokens: 1200
  max_transcript_chars: 30000
  max_description_chars: 4000

# Safe default: local-only never sends transcript or analysis content off-device.
intelligence:
  mode: local-only

# Deep analysis may use a stronger local model than fast scoring. The example
# keeps both identities equal; change model and digest together when overriding.
local_analysis:
  model: qwen3:8b
  base_url: http://127.0.0.1:11434
  expected_model_digest: sha256:500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41
  temperature: 0.0
  max_output_tokens: 5000
  max_transcript_chars: 48000
  max_description_chars: 4000
  prompt_version: knowledge-prompt-v2
  schema_version: knowledge-result-v2
  sampling_version: knowledge-sampling-v2
  privacy_version: knowledge-privacy-v2

cloud:
  enabled: false
  provider: openai
  # model required only when enabled: true
  api_key_env: OPENAI_API_KEY
  tokenizer_encoding: o200k_base
  max_calls_per_run: 5
  max_local_input_tokens_per_video: 28000
  max_input_tokens_per_video: 30000
  max_description_chars: 4000
  max_output_tokens: 4000
  prompt_version: analysis-prompt-v1
  schema_version: analysis-result-v1
  sampling_version: cloud-token-sampling-v1
  privacy_version: cloud-privacy-v1

storage:
  data_dir: data
  logs_dir: logs
  templates_dir: templates
  # Placeholder absolute path only — replace locally; never commit a real vault path.
  vault_root: /absolute/path/to/obsidian/vault
  vault_subdir: YouTube Intel
