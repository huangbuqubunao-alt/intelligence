[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "config/launchd/*.plist.example",
    "docs/operations.md",
]

[project]
name = "youtube-intel"
version = "0.1.0"
description = "A local-first YouTube intelligence agent"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "jinja2>=3.1.6,<3.2",
    "openai>=2.46.0,<2.47",
    "pydantic>=2.13.4,<2.14",
    "pyyaml>=6.0.3,<7",
    "spacy==3.8.15",
    "tiktoken>=0.13.0,<0.14",
    "yt-dlp[default,deno]>=2026.7.4,<2026.8",
]

[project.optional-dependencies]
mac-whisper = [
    "mlx-whisper>=0.4.3,<0.5",
]

[project.scripts]
youtube-intel = "youtube_intel.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.21,<0.16",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
strict = true
