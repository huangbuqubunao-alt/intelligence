[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "config/launchd/*.plist.example",
    "docs/operations.md",
]

[project]
name = "youtube-intel"
version = "0.1.0"
description = "A local-first YouTube intelligence agent"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6,<3.2",
    "mlx-whisper>=0.4.3,<0.5",
    "openai>=2.46.0,<2.47",
    "pydantic>=2.13.4,<2.14",
    "pyyaml>=6.0.3,<7",
    "tiktoken>=0.13.0,<0.14",
    "yt-dlp[default,deno]>=2026.7.4,<2026.8",
]

[dependency-groups]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.15.21,<0.16",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
python_version = "3.12"
strict = true
